name: yarn
version: 0.0.0
description: Reviews Yarn projects for insecure registries, mutable resolutions, and missing lockfiles.

triggers:
  manual: true
  files_changed:
    - "package.json"
    - "**/package.json"
    - "yarn.lock"
    - ".yarnrc"
    - ".yarnrc.yml"
    - "**/.yarnrc.yml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
