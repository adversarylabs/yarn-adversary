name: adversarylabs/deps/yarn
version: 0.0.10
description: Reviews Yarn projects for unsafe configuration and incomplete dependency-resolution inputs.

triggers:
  manual: true
  files_changed:
    - "package.json"
    - "**/package.json"
    - "yarn.lock"
    - ".yarnrc"
    - ".yarnrc.yml"
    - "**/.yarnrc.yml"
    - "Dockerfile"
    - "**/Dockerfile"
    - "Dockerfile.*"
    - "**/Dockerfile.*"
    - "*.dockerfile"
    - "**/*.dockerfile"

detection:
  files:
    - "yarn.lock"
    - "**/yarn.lock"
    - ".yarnrc"
    - ".yarnrc.yml"
    - "**/.yarnrc.yml"
    - "Dockerfile"
    - "**/Dockerfile"
    - "Dockerfile.*"
    - "**/Dockerfile.*"
    - "*.dockerfile"
    - "**/*.dockerfile"
    - ".yarn/**"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
